[pytest]
testpaths = tests
# Every test gets a hard wall-clock cap.
#
# Without one, a single hanging test stalls a CI run indefinitely with no
# diagnostic: tests/test_ai_admin_api.py did exactly that, and the run had to
# be killed by hand to find out which test was stuck. `thread` method dumps the
# stacks of every thread on expiry, which is what identified the blocking
# database call inside the async request-logging middleware.
timeout = 60
timeout_method = thread
